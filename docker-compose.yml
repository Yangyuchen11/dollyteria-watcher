services:
  dollyteria:
    build: .
    container_name: dollyteria-monitor
    restart: always
    ports:
      # 默认监听 5000 端口。若与服务器上的 yurara ERP 冲突，可将冒号左侧改为 5001:5000 或其他高位端口
      - "5000:5000"
    environment:
      - TZ=Asia/Tokyo
      - PORT=5000
      - HOST=0.0.0.0
      - NO_BROWSER=1
      - DATA_DIR=/app/data
      # 看板访问密码建议直接在 Web 界面【访问安全与密码】中设置并持久化保存
      # 如需强制使用环境变量覆盖，可取消下方注释并填入 (可选):
      # - WEB_PASSWORD=your_password_here
    volumes:
      - dollyteria-data:/app/data # 挂载旧数据卷
volumes:
  dollyteria-data:
    external: true
