services:
  dollyteria:
    build: .
    container_name: dollyteria-monitor
    restart: always
    ports:
      # 默认监听 5000 端口。若与服务器上的 yurara ERP 冲突，可将冒号左侧改为 5001:5000 或其他高位端口
      - "5000:5000"
    environment:
      - TZ=Asia/Tokyo
      - PORT=5000
      - HOST=0.0.0.0
      - NO_BROWSER=1
      - DATA_DIR=/app/data
      - WEB_PASSWORD=yyc931121
    volumes:
      - dollyteria-data:/app/data # 挂载旧数据卷
volumes:
  dollyteria-data:
    external: true
