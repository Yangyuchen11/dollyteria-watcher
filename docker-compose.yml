# 删掉最上面的 version: '3.8'

services:
  dollyteria:
    # （根据你实际的服务名填写）
    image: ...
    build: .
    restart: always
    ports:
      - "5000:5000"
    environment:
      - TZ=Asia/Tokyo
      - PORT=5000
      - HOST=0.0.0.0
      - NO_BROWSER=1
      - DATA_DIR=/app/data
      - WEB_PASSWORD=yyc931121
    volumes:
      - dollyteria-data:/app/data # 挂载旧数据卷

# 🔴 关键：必须在文件最下方加上这一段，定义外部数据卷！
volumes:
  dollyteria-data:
    external: true
