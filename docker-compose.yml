version: '3.8'

services:
  dollyteria:
    build: .
    container_name: dollyteria-monitor
    restart: always
    ports:
      # 默认监听 5000 端口。若与服务器上的 yurara ERP 冲突，可将冒号左侧改为 5001:5000 或其他高位端口
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - TZ=Asia/Tokyo
      - DATA_DIR=/app/data
      # 也可以在此直接指定看板访问密码 (优先级高于 config.json，可选):
      # - WEB_PASSWORD=your_password_here
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 300M   # 内存上限 300MB，确保绝不影响服务器上既有的 yurara ERP 服务
